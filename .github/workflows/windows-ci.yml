name: Windows CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: Full verification
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12.10
          architecture: x64
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1-x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Create project Python environment
        shell: pwsh
        run: |
          python -m venv python\.venv
          python\.venv\Scripts\python.exe -m pip install --require-hashes --only-binary :all: -r python\requirements-ci.lock
          $site = python\.venv\Scripts\python.exe -c "import sysconfig; print(sysconfig.get_path('purelib'))"
          Set-Content -LiteralPath (Join-Path $site 'contam_studio_core_checkout.pth') -Value ((Resolve-Path 'python\src').Path) -Encoding ASCII
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Full verification
        shell: pwsh
        run: powershell.exe -NoProfile -File scripts\verify.ps1 -Mode Full
