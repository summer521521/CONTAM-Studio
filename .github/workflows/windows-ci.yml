name: Windows CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: Full verification
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: 3.12.10
          architecture: x64
      - name: Set up pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288
        with:
          version: 11.14.0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.13.0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1-x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Resolve pnpm store
        id: pnpm_store
        shell: pwsh
        run: |
          "store-path=$(pnpm store path --silent)" >> $env:GITHUB_OUTPUT
      - name: Cache pnpm downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.pnpm_store.outputs.store-path }}
          key: windows-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Cache pip downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}\pip-cache
          key: windows-pip-${{ hashFiles('python/requirements-ci.lock') }}
      - name: Cache Cargo registry and git
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Create project Python environment
        shell: pwsh
        run: |
          $env:PIP_CACHE_DIR = Join-Path $env:RUNNER_TEMP 'pip-cache'
          python -m venv python\.venv
          python\.venv\Scripts\python.exe -m pip install --require-hashes --only-binary :all: -r python\requirements-ci.lock
          $site = python\.venv\Scripts\python.exe -c "import sysconfig; print(sysconfig.get_path('purelib'))"
          Set-Content -LiteralPath (Join-Path $site 'contam_studio_core_checkout.pth') -Value ((Resolve-Path 'python\src').Path) -Encoding ASCII
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Full verification
        shell: pwsh
        run: powershell.exe -NoProfile -File scripts\verify.ps1 -Mode Full
