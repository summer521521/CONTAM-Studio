name: Release asset attestation

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify and attest
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  attest:
    name: Verify published checksums and attest
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Download release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          New-Item -ItemType Directory -Path release-assets | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir release-assets
      - name: Verify release identity and checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft,isPrerelease,tagName,targetCommitish | ConvertFrom-Json
          if ($release.isDraft -or $release.isPrerelease) { throw "Only a published stable release can be attested" }
          if ($release.tagName -ne $env:RELEASE_TAG) { throw "Release tag mismatch" }
          $checksums = Join-Path $PWD "release-assets\SHA256SUMS.txt"
          if (-not (Test-Path -LiteralPath $checksums -PathType Leaf)) { throw "SHA256SUMS.txt is missing" }
          foreach ($line in Get-Content -LiteralPath $checksums -Encoding UTF8) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw "Invalid checksum line: $line" }
            $asset = Join-Path $PWD ("release-assets\" + $Matches[2])
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Release asset is missing: $($Matches[2])" }
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
            if ($actual -ne $Matches[1]) { throw "Checksum mismatch: $($Matches[2])" }
          }
          @{
            schemaVersion = 1
            assertion = "The named GitHub Release assets matched the published SHA-256 manifest."
            repository = $env:GITHUB_REPOSITORY
            tag = $env:RELEASE_TAG
            workflowCommit = $env:GITHUB_SHA
            authenticode = "unsigned"
            limitation = "This is a release verification attestation, not Windows publisher identity or build provenance."
          } | ConvertTo-Json | Set-Content -LiteralPath release-predicate.json -Encoding UTF8
      - name: Create Sigstore release verification attestation
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35
        with:
          subject-checksums: release-assets/SHA256SUMS.txt
          predicate-type: https://github.com/summer521521/CONTAM-Studio/attestations/release-verification/v1
          predicate-path: release-predicate.json
