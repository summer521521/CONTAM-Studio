[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "contam-studio-core"
version = "0.5.0"
description = "Strict PRJ Zone reading, copy-only patches, and isolated CONTAM inspection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "contamxpy==0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<0.13",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
