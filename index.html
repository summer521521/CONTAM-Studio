<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>CONTAM Studio</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: #20262e;
        color: #eef2f6;
        font-family: "Segoe UI", "Microsoft YaHei UI", Arial, sans-serif;
      }

      .desktop-startup-shell {
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
        background: #20262e;
      }

      .desktop-startup-status {
        display: grid;
        justify-items: center;
        gap: 14px;
      }

      .desktop-startup-mark {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 6px;
        background: #155b91;
        color: #ffffff;
        font-size: 25px;
        font-weight: 700;
      }

      .desktop-startup-title {
        margin: 0;
        font-size: 18px;
        font-weight: 650;
      }

      .desktop-startup-copy {
        margin: 0;
        color: #bec7d0;
        font-size: 12px;
      }

      .desktop-startup-progress {
        width: 156px;
        height: 2px;
        overflow: hidden;
        background: #414b55;
      }

      .desktop-startup-progress::after {
        display: block;
        width: 48%;
        height: 100%;
        content: "";
        background: #62aafa;
        animation: desktop-startup-progress 1.1s ease-in-out infinite alternate;
      }

      @keyframes desktop-startup-progress {
        from { transform: translateX(-100%); }
        to { transform: translateX(210%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .desktop-startup-progress::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="desktop-startup-shell" aria-label="CONTAM Studio is starting">
        <div class="desktop-startup-status" role="status">
          <div class="desktop-startup-mark" aria-hidden="true">C</div>
          <p class="desktop-startup-title">CONTAM Studio</p>
          <p class="desktop-startup-copy">正在启动桌面工作区 · Starting desktop workspace</p>
          <div class="desktop-startup-progress" aria-hidden="true"></div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
