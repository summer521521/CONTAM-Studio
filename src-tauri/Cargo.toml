[package]
name = "contam-studio"
version = "0.1.0"
description = "Offline-first desktop workbench for CONTAM teaching and research"
authors = ["CONTAM Studio contributors"]
edition = "2021"

[lib]
name = "contam_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
uuid = { version = "1", default-features = false, features = ["v5"] }
